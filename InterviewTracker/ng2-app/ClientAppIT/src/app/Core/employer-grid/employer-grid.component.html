<div class="toolbar">
  <button mat-raised-button color="primary" (click)="addEmployer()">
    <mat-icon>add</mat-icon> Add Employer
  </button>
</div>

<table
  mat-table
  [dataSource]="dataSource"
  matSort
  multiTemplateDataRows
  class="mat-elevation-z8 full-width-table"
>
  <!-- Company -->
  <ng-container matColumnDef="companyName">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Company</th>
    <td mat-cell *matCellDef="let row">{{ row.companyName || "-" }}</td>
  </ng-container>

  <!--WebSite Link -->
  <ng-container matColumnDef="websiteLink">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>WebSite Link</th>
    <td mat-cell *matCellDef="let row">{{ row.websiteLink || "-" }}</td>
  </ng-container>

  <!-- Type -->
  <ng-container matColumnDef="type">
    <th mat-header-cell *matHeaderCellDef>Type</th>
    <td mat-cell *matCellDef="let row">{{ row.type || "-" }}</td>
  </ng-container>

  <!-- HR Column -->
  <ng-container matColumnDef="hrDetails">
    <th mat-header-cell *matHeaderCellDef>HR</th>
    <td mat-cell *matCellDef="let row">
      <button
        mat-button
        class="hr-link"
        color="accent"
        *ngIf="row.hrDetail"
        (click)="viewHrDetails(row.hrDetail); $event.stopPropagation()"
      >
        {{ row.hrDetail.name }}
      </button>
      <span *ngIf="!row.hrDetail">-</span>
    </td>
  </ng-container>

  <!-- Status -->
  <ng-container matColumnDef="interviewStatus">
    <th mat-header-cell *matHeaderCellDef>Status</th>
    <td mat-cell *matCellDef="let row">{{ row.interviewStatus || "-" }}</td>
  </ng-container>

  <!-- CTC -->
  <ng-container matColumnDef="ctcOffered">
    <th mat-header-cell *matHeaderCellDef>CTC</th>
    <td mat-cell *matCellDef="let row">{{ row.ctcOffered || "-" }}</td>
  </ng-container>

  <!-- Location -->
  <ng-container matColumnDef="location">
    <th mat-header-cell *matHeaderCellDef>Location</th>
    <td mat-cell *matCellDef="let row">{{ row.location || "-" }}</td>
  </ng-container>

  <!-- Actions -->
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Actions</th>
    <td mat-cell *matCellDef="let row">
      <button mat-button color="primary" (click)="editEmployer(row)">
        Edit
      </button>
    </td>
  </ng-container>

  <!-- Header -->
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

  <!-- Rows -->
  <tr
    mat-row
    *matRowDef="let row; columns: displayedColumns"
    class="data-row"
  ></tr>

  <tr mat-row class="detail-row"></tr>
</table>

<mat-paginator [pageSize]="10"></mat-paginator>
