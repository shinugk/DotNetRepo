<div *ngIf="isLoading" class="loading">
  <mat-spinner></mat-spinner>
</div>

<div *ngIf="!isLoading && userProfile" class="profile-wrapper">

  <!-- 🔷 PROFILE HEADER -->
  <mat-card class="profile-header">
    <img
      [src]="userProfile.profilePictureUrl"
      alt="Profile Picture"
      class="profile-avatar"
    />

    <div class="profile-title">
      <h2>{{ userProfile.name }}</h2>
      <p>{{ userProfile.email }}</p>
    </div>

    <span class="spacer"></span>

    <button mat-raised-button color="primary" routerLink="/profile/edit">
      <mat-icon>edit</mat-icon>
      Edit Profile
    </button>
  </mat-card>

  <!-- 🔷 PROFILE DETAILS -->
  <mat-card class="profile-details">
    <div class="details-grid">

      <div class="label">User ID</div>
      <div class="value">{{ userProfile.id }}</div>

      <div class="label">Google ID</div>
      <div class="value">{{ displayValue(userProfile.googleId) }}</div>

      <div class="label">Age</div>
      <div class="value">{{ displayValue(userProfile.age) }}</div>

      <div class="label">Phone</div>
      <div class="value">{{ displayValue(userProfile.phoneNumber) }}</div>

      <div class="label">Company</div>
      <div class="value">{{ displayValue(userProfile.currentCompany) }}</div>

      <div class="label">Skills</div>
      <div class="value">
      <mat-chip-listbox class="skills-chips">
        <mat-chip *ngFor="let skill of skillList">
          {{ skill }}
        </mat-chip>
      </mat-chip-listbox>
      </div>

      <div class="label">Resume</div>
      <div class="value actions">
        <button mat-stroked-button color="primary" (click)="previewResume()">
          <mat-icon>visibility</mat-icon>
          Preview
        </button>

        <button
          mat-stroked-button
          color="accent"
          (click)="downloadResume()"
          [disabled]="isDownloading"
        >
          <mat-icon>download</mat-icon>
          Download
        </button>
      </div>

    </div>
  </mat-card>

</div>
