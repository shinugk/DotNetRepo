<h2>Database Health Check</h2>
<div *ngIf="loading">Checking DB status...</div>
<div *ngIf="error" class="error">
  {{ error }}
</div>

<pre *ngIf="healthResponse"
  >{{ healthResponse | json }}
</pre>

<pre *ngIf="userResponse"
  >{{ userResponse | json }}
</pre>

<button (click)="logout()">Logout</button>
