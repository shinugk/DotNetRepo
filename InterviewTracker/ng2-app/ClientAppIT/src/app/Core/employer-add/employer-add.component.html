<h2>Add Employer</h2>

<form [formGroup]="employerForm">
  <mat-form-field class="full-width">
    <mat-label>Company Name</mat-label>
    <input matInput formControlName="companyName" />
  </mat-form-field>

  <mat-form-field class="full-width">
    <mat-label>Website</mat-label>
    <input matInput formControlName="websiteLink" />
  </mat-form-field>

  <mat-form-field class="full-width">
    <mat-label>Location</mat-label>
    <input matInput formControlName="location" />
  </mat-form-field>

  <mat-form-field class="full-width">
    <mat-label>Type</mat-label>
    <input matInput formControlName="type" />
  </mat-form-field>

  <mat-form-field class="full-width">
    <mat-label>Interview Status</mat-label>
    <input matInput formControlName="interviewStatus" />
  </mat-form-field>

  <mat-form-field class="full-width">
    <mat-label>CTC Offered</mat-label>
    <input matInput formControlName="ctcOffered" />
  </mat-form-field>

  <h3>HR Details</h3>

  <div formGroupName="hrDetail">
    <mat-form-field class="full-width">
      <mat-label>HR Name</mat-label>
      <input matInput formControlName="name" />
    </mat-form-field>

    <mat-form-field class="full-width">
      <mat-label>Phone</mat-label>
      <input matInput formControlName="phoneNumber" />
    </mat-form-field>

    <mat-form-field class="full-width">
      <mat-label>Email</mat-label>
      <input matInput formControlName="emailId" />
    </mat-form-field>
  </div>

  <div class="button-group">
    <button mat-raised-button color="primary" (click)="save()">Save</button>
    <button mat-button color="warn" (click)="cancel()">Cancel</button>
  </div>
</form>
